<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Familia Bot Agente - Asistente inteligente para tu familia.">
  <title>Familia Bot Agente</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 48px 32px;
      max-width: 560px;
      width: 100%;
      backdrop-filter: blur(10px);
    }
    h1 { font-size: 2rem; margin-bottom: 12px; color: #fff; }
    p { line-height: 1.6; color: #94a3b8; margin-bottom: 24px; }
    .cta {
      display: inline-block;
      background: #3b82f6;
      color: #fff;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .cta:hover { background: #2563eb; }
    footer { margin-top: 32px; font-size: 0.85rem; color: #64748b; }
    footer a { color: #94a3b8; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Familia Bot Agente</h1>
    <p>Asistente inteligente para organizar y conectar a tu familia. Próximamente disponible.</p>
    <a class="cta" href="privacy.html">Política de privacidad</a>
  </main>
  <footer>
    &copy; 2026 Familia Bot Agente &middot; <a href="privacy.html">Privacidad</a>
  </footer>
</body>
</html>
